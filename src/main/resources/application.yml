spring:
  application:
    name: mini-fms-backend

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: lz4
      properties:
        # 재시도로 인한 중복·순서 뒤바뀜을 브로커가 막는다(파티션 단위).
        enable.idempotence: true
        linger.ms: 5
        # 브로커 메타데이터를 얻지 못할 때 send() 가 호출 스레드를 붙잡는 최대 시간. 제어·접수 API 스레드가
        # 브로커 장애 동안 오래 묶이지 않도록 응답 확인 대기(publish-timeout·transmit-timeout)와 같은 수준으로 둔다.
        max.block.ms: 3000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
    listener:
      ack-mode: batch

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  # ClickHouse(HTTP 8123) — 과거 궤적 저장소
  datasource:
    url: jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:fms}
    username: ${CLICKHOUSE_USER:fms}
    password: ${CLICKHOUSE_PASSWORD:fms_local}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    hikari:
      pool-name: clickhouse
      maximum-pool-size: 4
  sql:
    init:
      mode: always
      schema-locations: classpath:clickhouse/schema.sql

  # Elasticsearch — 돌발상황 관제 이력 검색. 꺼져 있어도 앱은 뜨고 접수·경고 발행은 계속된다.
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 1s
    socket-timeout: 3s

  task:
    scheduling:
      pool:
        # 브로커 장애 때 오래 막힐 수 있는 주기 작업(아웃박스 릴레이 2개·잠금 조정기·시뮬레이터)이 스레드를 다 잡아도
        # Redis 만 쓰는 명령 타임아웃 보상·오래된 차량 정리는 돌 수 있게 넉넉히 둔다.
        size: 8
      thread-name-prefix: fms-sched-

  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # 이력 검색 저장소 장애가 앱 전체를 DOWN(→ 트래픽 차단)으로 만들면 접수·경고 발행까지 멈춘다.
    # 이력 검색의 장애는 검색 API 의 503 으로만 드러낸다.
    elasticsearch:
      enabled: false
    # db 헬스는 ClickHouse 만 본다(DataSourceConfig). 라이드 DB 장애로 앱이 트래픽에서 빠지면 수집·돌발상황 경고까지 멈춘다.

fms:
  topics:
    telematics-raw: telematics-raw-events
    telematics-dlt: telematics-raw-events.DLT
    geofence-alerts: vehicle-geofence-alerts
    commands: vehicle-commands
    command-acks: vehicle-command-acks
    command-compensations: vehicle-command-compensations
    incident-alerts: c-its-incident-alerts
    incident-results: c-its-incident-results
    payment-requests: ride-payment-requests
    partitions: 6
    replication-factor: 1

  consumers:
    realtime-concurrency: 3
    history-concurrency: 3

  telematics:
    # 받을 수 있는 측정 시각 범위(단말에 대한 가정):
    #   max-past-age    — 통신 두절 동안 버퍼에 모아 두었다가 올리는 기간
    #   max-future-skew — 단말 시계 오차 허용 폭(앞선 시각 한 건이 그 시각까지 최신 위치 갱신을 멈추게 하므로 작게)
    max-past-age: 7d
    max-future-skew: 30s
    publish-timeout: 3s

  idempotency:
    window: 10m
    lease: 15s

  location:
    active-threshold: 60s
    stale-after: 10m
    eviction-interval: 1m
    latest-ttl: 7d

  geofence:
    fences:
      - id: SEOUL-DC
        name: 서울 물류센터
        latitude: 37.5665
        longitude: 126.9780
        radius-meters: 1000
        hysteresis-meters: 30

  command:
    ack-timeout: 5s
    timeout-scan-interval: 500ms
    transmit-timeout: 3s
    # 차량 실행 마감(expiresAt) = 요청 시각 + ack-timeout - 이 값. 마감 직전에 실행한 명령의 ACK 가
    # 서버 마감 전에 도착할 여유(ACK 전달 지연에 대한 가정)다.
    device-execution-margin: 1500ms
    lock-grace: 10s
    record-retention: 24h

  incident:
    alert-radius-km: 2.0
    alert-ttl: 10m

  incident-history:
    index: c-its-incidents
    max-search-range: 31d
    max-page-size: 100

  outbox:
    relay-interval: 200ms
    batch-size: 200

  ride:
    # 라이드·기기 상태·결제 아웃박스 DB(PostgreSQL). HikariCP 속성을 그대로 받는다. 스키마는 Flyway(db/migration).
    datasource:
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fms}
      username: ${POSTGRES_USER:fms}
      password: ${POSTGRES_PASSWORD:fms_local}
      pool-name: ride
      maximum-pool-size: 10
      connection-timeout: 3000
    # 같은 기기에 대한 대여·반납 분산 락(Redisson)을 기다리는 최대 시간. 넘으면 409.
    lock-wait: 3s
    # 대여·반납 판정에 쓰는 단말 위치(측정 시각)가 이보다 오래되면 받지 않는다(422).
    max-location-age: 30s
    # 반납은 대여 뒤에 측정한, 이 속도(km/h) 이하로 정차한 보고로만 판정한다(422 DEVICE_MOVING). 정차 중 GPS 흔들림보다 크게 둔다.
    return-max-speed-kmh: 3
    pricing:
      unlock-fee: 1000
      per-minute-fee: 150
      discount-zone-amount: 500
      penalty-zone-amount: 10000
      # 구독권 할인 = 잠금해제료 면제분 + 주행요금 × 할인율. 구역 벌금에는 적용하지 않는다.
      # 이용자가 대여할 때 쓸 구독권을 지정한다(subscriptionPlan). 지정하지 않으면 정가다.
      subscription-plans:
        - code: PASS_30
          riding-discount-percent: 30
        - code: PASS_UNLOCK_FREE
          unlock-fee-waived: true
    # 반납 뒤 잠금 명령 발송·확인(LOCKED → AVAILABLE)
    lock-reconcile:
      interval: 500ms
      pending-check-interval: 1s
      retry-base: 5s
      retry-max: 5m
      batch-size: 100

  # 반납 구역(다각형, WKT 는 "경도 위도" 순서). 여러 구역이 겹치면 NO_RETURN > PENALTY > DISCOUNT > SERVICE 순으로 하나를 고른다.
  # 어느 구역에도 속하지 않으면 서비스 지역 밖이라 반납을 받지 않는다.
  return-zones:
    zones:
      - id: SEOUL-CENTRAL
        name: 서울 도심 서비스 구역
        type: SERVICE_ZONE
        polygon: POLYGON((126.9480 37.5415, 127.0080 37.5415, 127.0080 37.5915, 126.9480 37.5915, 126.9480 37.5415))
      - id: CITY-HALL-PARKING
        name: 시청역 킥보드 주차 구역
        type: DISCOUNT_ZONE
        polygon: POLYGON((126.9770 37.5655, 126.9790 37.5655, 126.9790 37.5670, 126.9770 37.5670, 126.9770 37.5655))
      - id: GWANGHWAMUN-CROSSWALK
        name: 광화문 횡단보도·점자블록
        type: PENALTY_ZONE
        polygon: POLYGON((126.9760 37.5700, 126.9780 37.5700, 126.9780 37.5712, 126.9760 37.5712, 126.9760 37.5700))
      - id: CHEONGGYECHEON
        name: 청계천 산책로
        type: NO_RETURN_ZONE
        polygon: POLYGON((126.9780 37.5685, 126.9900 37.5685, 126.9900 37.5695, 126.9780 37.5695, 126.9780 37.5685))

  payment-outbox:
    relay-interval: 200ms
    batch-size: 100
    # 브로커 확인 대기. 프로듀서 delivery.timeout.ms(30초)보다 길어야 한다(기동 때 확인). 짧으면 프로듀서가 아직 재전송 중인
    # 행의 잠금을 풀어 다음 주기가 같은 결제 요청을 또 보낸다. 그동안 행 잠금을 쥐므로 다른 인스턴스는 그 행을 건너뛴다.
    send-timeout: 35s
    # 발행이 확인된 행을 이 기간 뒤 지운다.
    retention: 7d
    purge-interval: 1h

  security:
    jwt:
      # 32바이트 이상. 비어 있으면 기동하지 않는다(로컬은 local 프로필이 개발용 값을 넣는다).
      secret: ${FMS_JWT_SECRET:}
      issuer: mini-fms
      dev-token-enabled: false

  simulator:
    telemetry:
      enabled: ${FMS_SIMULATOR_ENABLED:true}
      vehicle-count: 10
      interval: 1s
      duplicate-rate: 0.05
      speed-multiplier: 5
      depot-latitude: 37.5665
      depot-longitude: 126.9780
    responder:
      enabled: ${FMS_SIMULATOR_ENABLED:true}
      min-delay: 300ms
      max-delay: 1500ms
      # 타임아웃·거절 시연용 차량
      unresponsive-vehicles: [V-010]
      rejecting-vehicles: [V-009]

logging:
  level:
    com.minifms: INFO
    org.apache.kafka: WARN
